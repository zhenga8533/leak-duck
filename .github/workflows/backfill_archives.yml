name: Backfill Event Archives

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Archive years to rebuild (space separated, e.g. 2025 2026)"
        required: true
        default: "2025 2026"
      dry_run:
        description: "Report changes without publishing them"
        type: boolean
        default: true

concurrency:
  group: leak-duck-data-publisher
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Configure output directory
        run: echo "LEAK_DUCK_OUTPUT_DIR=$RUNNER_TEMP/leak-duck-data" >> "$GITHUB_ENV"

      - name: Check out main branch for code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -v

      - name: Rebuild archives from their source pages
        run: |
          python -m src.backfill ${{ inputs.years }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit and push rebuilt archives to data branch
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin data
          git checkout -B data origin/data

          mkdir -p archives
          cp -R "$LEAK_DUCK_OUTPUT_DIR/archives/." archives/
          git add -- archives/

          if git diff --cached --quiet; then
            echo "Archives are already up to date"
          else
            git commit -m "Rebuild event archives from source pages"
            git push origin data
          fi
